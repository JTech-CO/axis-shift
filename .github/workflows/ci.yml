name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_BASE_PATH: /axis-shift/

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Report tool versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Global coverage report
        run: npm run test:coverage

      - name: M02 core coverage
        run: npm run test:coverage:domain

      - name: M02 exhaustive math audit
        run: npm run test:math:exhaustive

      - name: Static accessibility audit
        run: npm run test:a11y

      - name: Check module boundaries
        run: npm run check:boundaries

      - name: Validate levels
        run: npm run validate:levels

      - name: Audit Daily generator
        run: npm run audit:daily

      - name: Scan secrets
        run: npm run audit:secrets

      - name: Build
        run: npm run build

      - name: Install core browser
        run: npx playwright install --with-deps chromium

      - name: Core non-root route E2E
        run: npm run test:e2e -- --project=chromium
